# Lab-only probe (not generated by buildkite-gha). Sends deliberately invalid
# batches with a direct-API grant bound to this file and commit, then prints the
# Buildkite status and response body. It checks in memory whether the response
# contains any sent value and never prints values itself.
name: Probe Buildkite migration error bodies (lab)

on:
  workflow_dispatch:
    inputs:
      grant_id:
        required: true
        type: string
      case:
        required: true
        type: choice
        options: [whitespace, oversize, extra-key]

permissions:
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GRANT_ID: ${{ inputs.grant_id }}
      CASE: ${{ inputs.case }}
      V_WS: ${{ secrets.SMN_WHITESPACE }}
      V_WS_PARTNER: ${{ secrets.SMN_WS_PARTNER }}
      V_OS: ${{ secrets.SMN_OVERSIZE }}
      V_OS_PARTNER: ${{ secrets.SMN_OS_PARTNER }}
    steps:
      - name: Probe
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re, sys, urllib.error, urllib.parse, urllib.request
          e = os.environ
          grant = e["GRANT_ID"]
          if not re.fullmatch(r"[A-Za-z0-9_-]{16,200}", grant):
              sys.exit("bad grant id")
          cases = {
              "whitespace": {"SMN_WHITESPACE": e["V_WS"], "SMN_WS_PARTNER": e["V_WS_PARTNER"]},
              "oversize": {"SMN_OVERSIZE": e["V_OS"], "SMN_OS_PARTNER": e["V_OS_PARTNER"]},
              "extra-key": {"SMN_WS_PARTNER": e["V_WS_PARTNER"], "SMN_OS_PARTNER": e["V_OS_PARTNER"]},
          }
          values = cases[e["CASE"]]
          print("case", e["CASE"], "keys", sorted(values), "value bytes", {k: len(v.encode()) for k, v in values.items()})
          url = ("https://api.buildkite.com/v2/organizations/sj26-testier/clusters/"
                 "ac401915-31f3-4baa-b812-5073b4d7d425/github-actions-secret-migrations/" + grant + "/secrets")
          token_url = e["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&" + urllib.parse.urlencode({"audience": url})
          req = urllib.request.Request(token_url, headers={"Authorization": "Bearer " + e["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]})
          oidc = json.load(urllib.request.urlopen(req, timeout=30))["value"]
          body = json.dumps({"secrets": values}, ensure_ascii=False).encode()
          req = urllib.request.Request(url, data=body, method="POST", headers={
              "Authorization": "Bearer " + oidc, "Content-Type": "application/json", "Accept": "application/json"})
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  status, text = r.status, r.read().decode("utf-8", "replace")
          except urllib.error.HTTPError as err:
              status, text = err.code, err.read().decode("utf-8", "replace")
          needles = []
          for v in values.values():
              for form in (v, json.dumps(v, ensure_ascii=False)[1:-1], json.dumps(v)[1:-1]):
                  if form.strip():
                      needles.append(form)
              needles += [t for t in re.findall(r"cnry[0-9a-f]{24}", v)]
          leaked = any(n in text for n in needles)
          for n in needles:
              text = text.replace(n, "[VALUE]")
          print("HTTP", status)
          print("response contains a sent value or canary token:", leaked)
          print("response body (defensively scrubbed):", text[:2000])
          PY
